ss="pw-reqs"><div id="reqLen" class="pw-req">○ Mínimo 10 caracteres</div><div id="reqUpper" class="pw-req">○ Al menos 1 mayúscula</div><div id="reqLower" class="pw-req">○ Al menos 1 minúscula</div><div id="reqNum" class="pw-req">○ Al menos 1 número</div><div id="reqSym" class="pw-req" style="grid-column:1/-1">○ Al menos 1 símbolo especial (!@#$%...)</div></div></label><label class="field"><span>Confirmar contraseña <span class="req">*</span></span><input id="swPass2" name="claveConfirm" class="input" type="password" autocomplete="new-password" required><div id="pwMatchHelp" class="field-help" style="margin-top:8px">Introduce la misma contraseña</div></label></div></div><div class="setup-section"><div class="setup-sec-title">${I('building')} 2. Datos de Mi Entidad (Transportista efectivo)</div><div class="grid grid2"><label class="field"><span>Razón social / Nombre de la empresa</span><input name="empresa_nombre" class="input" type="text" placeholder="Ej. Transportes Ibéricos S.L."></label><label class="field"><span>NIF / CIF</span><input name="empresa_nif" class="input" type="text" placeholder="Ej. B12345678"></label><label class="field"><span>Domicilio fiscal</span><input name="empresa_domicilio" class="input" type="text" placeholder="Calle, número, nave"></label><label class="field"><span>Municipio / Localidad</span><input name="empresa_ciudad" class="input" type="text" placeholder="Municipio"></label><label class="field"><span>Código postal</span><input name="empresa_cp" class="input" type="text" placeholder="28001"></label><label class="field"><span>Provincia</span><input name="empresa_provincia" class="input" type="text" placeholder="Madrid"></label><label class="field"><span>Teléfono de contacto</span><input name="empresa_telefono" class="input" type="tel" placeholder="+34 912 345 678"></label><label class="field"><span>Nº Autorización de transporte</span><input name="empresa_aut_num" class="input" type="text" placeholder="MDPE-12345678"></label></div></div><div id="swError" class="error" style="font-size:13px;padding:8px 0" aria-live="polite"></div></div><div class="form-footer" style="margin:0;border-radius:0;border-left:0;border-right:0;border-bottom:0"><span class="muted small">Paso único · El registro de instalación se protegerá de inmediato</span><button type="submit" id="swSubmitBtn" class="btn-primary" style="padding:0 24px">${I('save')} Finalizar instalación y entrar</button></div></form></div></div>`;

async function loadCore(){clients=await api('/api/clientes').catch(()=>[]);if(perm('empresas'))companies=await api('/api/empresas').catch(()=>[]);if(perm('transporte')){vehicles=await api('/api/vehiculos').catch(()=>[]);drivers=await api('/api/conductores').catch(()=>[]);}if(perm('mercancias'))goods=await api('/api/mercancias').catch(()=>[]);if(perm('ubicaciones'))locations=await api('/api/ubicaciones').catch(()=>[]);}

async function pageDashboard(){let all=[];try{all=await api('/api/docs-todos');}catch{}docs=all;const total=all.length;const active=all.filter(d=>['borrador','emitido'].includes(d.estado)).length;const cutoff=Date.now()-30*864e5;const closed=all.filter(d=>d.estado==='cerrado'&&new Date(d.mod||d.creado).getTime()>=cutoff).length;let alerts=[];if(perm('transporte')){const today=nowDate();vehicles.forEach(v=>{if(v.itv&&v.itv<today)alerts.push({cls:'danger',text:`Vehículo ${v.matricula} con ITV caducada (${fmtDate(v.itv)}).`});});}const oldDrafts=all.filter(d=>d.estado==='borrador'&&Date.now()-new Date(d.creado).getTime()>48*3600e3).length;if(oldDrafts)alerts.push({cls:'warn',text:`${oldDrafts} borrador${oldDrafts===1?'':'es'} sin emitir desde hace más de 48 h.`});const recent=all.slice(0,6);const userName=state.user?.nombre?.split(/\s+/)[0]||'usuario';document.getElementById('view').innerHTML=`${head(`Buenos días, ${userName}`,'Resumen de la actividad de tu entidad',canCreateDocs()?`<button class="btn-primary" data-go="nuevo-envio">${I('plus')} Registrar nuevo envío</button>`:'')}<div class="stats">${statCard('truck',total,'Envíos totales',`${all.filter(d=>d.tipo==='deca').length} DeCA · ${all.filter(d=>d.tipo==='ecmr').length} eCMR`)}${statCard('clock',active,'En curso',`${all.filter(d=>d.estado==='emitido').length} emitidos activos`)}${statCard('check',closed,'Cerrados (30 días)','Documentos cerrados en el periodo')}${statCard('alert',alerts.length,'Alertas',alerts.length?'Requieren revisión':'Sin incidencias detectadas')}</div><div class="dashboard-grid mt6"><section class="card"><div class="section-head"><span class="section-title">Envíos recientes</span><button class="btn-ghost btn-small" data-go="envios">Ver todos</button></div>${recent.length?recent.map(d=>`<div class="list-row" data-view-doc="${d.id}"><div class="row-main"><div class="row-title">${esc(d.datos.origen||'Origen')} → ${esc(d.datos.destino||'Destino')}</div><div class="row-sub">${esc(d.num)} · ${esc async function pageShipments(){docs=(await api('/api/docs-todos').catch(()=>[])).map(d=>({...d,tipo:d.tipo||String(d.num||'').split('-')[0].toLowerCase()}));let tab='todos',q='';const counts=()=>{const arr=['todos','borrador','emitido','anulado','cerrado'];return Object.fromEntries(arr.map(s=>[s,s==='todos'?docs.length:docs.filter(d=>d.estado===s).length]));};const render=()=>{const c=counts();const list=docs.filter(d=>(tab==='todos'||d.estado===tab)&&`${d.num} ${d.datos.cliente||''} ${d.datos.matricula||''} ${d.datos.origen||''} ${d.datos.destino||''}`.toLowerCase().includes(q.toLowerCase()));document.getElementById('view').innerHTML=`${head('Envíos','Documentos DeCA y eCMR de tu entidad',canCreateDocs()?`<button class="btn-primary" id="newShipment">${I('plus')} Registrar nuevo envío</button>`:'')}<div class="tabs" id="shipmentTabs">${[['todos','Todos'],['borrador','Borradores'],['emitido','Emitidos'],['anulado','Anulados'],['cerrado','Cerrados']].map(([id,l])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${l}<span class="pill-count">${c[id]}</span></button>`).join('')}</div><div class="searchbar mb4">${I('search')}<input class="input" id="shipmentSearch" placeholder="Buscar por número, cliente, matrícula u origen/destino" value="${esc(q)}"></div><div class="grid grid2">${list.map(d=>`<button class="tile-btn" data-doc="${d.id}"><div class="tile-top"><span class="badge gray">${esc(d.tipo.toUpperCase())}</span><span class="row-sub mono">${esc(d.num)}</span><span style="margin-left:auto">${badge(d.estado)}</span></div><p class="page-sub" style="color:var(--fg);font-size:18px;font-weight:650;margin:12px 0 0">${esc(d.datos.origen||'Origen')} ${I('arrow',16)} ${esc(d.datos.destino||'Destino')}</p><div class="tile-meta"><span>${esc(d.datos.cliente||'—')}</span><span>·</span><span>${esc(d.datos.mercancia||'—')}</span><span>·</span><span>${fmtDate(d.creado)}</span></div></button>`).join('')||`<div class="card empty" style="grid-column:1/-1">No hay documentos en esta categoría.</div>`}</div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});document.getElementById('shipmentSearch').oninput=e=>{q=e.target.value;render();document.getElementById('shipmentSearch').focus();document.getElementById('shipmentSearch').setSelectionRange(q.length,q.length)};document.getElementById('newShipment')?.addEventListener('click',()=>go('nuevo-envio'));document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>openDocModal(docs.find(d=>String(d.id)===b.dataset.doc)));};render();}

function fieldHtml(key,label,type='text',value='',required=false,extra=''){return `<label class="field"><span>${esc(label)}${required?` <span class="req">*</span>`:''}</span><input name="${esc(key)}" class="input" type="${type==='number'?'number':type==='date'?'date':type==='password'?'password':'text'}" value="${esc(value)}" ${required?'required':''} ${extra}></label>`}
function selectHtml(key,label,options,value='',required=false,disabled=false){return `<label class="field"><span>${esc(label)}${required?` <span class="req">*</span>`:''}</span><select name="${esc(key)}" class="select" ${required?'required':''} ${disabled?'disabled':''}><option value="">Selecciona…</option>${options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`}
function section(title,body,right=''){return `<section class="card form-card"><div class="form-card-head"><strong>${esc(title)}</strong>${right}</div><div class="form-card-body">${body}</div></section>`}
async function pageNewShipment(){
  const f=state.fields||await api('/api/campos');
  const defaultType=perm('deca_crear')?'deca':'ecmr';
  // mi_papel: 'transportista' = tu empresa es el transportista, buscas cargador
  //           'cargador'      = tu empresa es el cargador, buscas transportista
  let s={tipo:defaultType,mi_papel:'transportista',contraparte_id:'',contraparte_nombre:'',contraparte_nif:'',contraparte_direccion:'',f_carga:nowDate(),origen:'',destino:'',mercancia:'',peso:'',matricula:'',remolque:'',conductor:'',autorizacion:'',obs:'',obs_transportista:'',destinatario:'',instrucciones:'',reservas:'',bultos:''};

  // Abre modal rápido para crear empresa contraparte
  function abrirModalNuevaContraparte(){
    const wrap=document.createElement('div');
    wrap.innerHTML=`<div class="modal-backdrop"><div class="modal small"><div class="modal-head"><div class="modal-title">Nueva empresa contraparte</div><button class="close-btn" id="qcClose">${I('x')}</button></div><div class="modal-body"><form id="qcForm" class="grid grid2">${fieldHtml('nombre','Razón social / Nombre','text','',true)}${fieldHtml('nif','NIF / CIF','text','',true)}${fieldHtml('direccion','Dirección completa','text','',true)}${fieldHtml('cp','Código postal','text','')}${fieldHtml('ciudad','Ciudad / Municipio','text','')}${fieldHtml('tel','Teléfono','text','')}</form></div><div class="modal-foot"><button class="btn-secondary" id="qcCancel">Cancelar</button><button class="btn-primary" id="qcSave">${I('save')} Guardar y seleccionar</button></div></div></div>`;
    document.body.appendChild(wrap.firstElementChild);
    const modal=document.body.lastElementChild;
    const close=()=>modal.remove();
    document.getElementById('qcClose').onclick=close;
    document.getElementById('qcCancel').onclick=close;
    document.getElementById('qcSave').onclick=async()=>{
      const fd=new FormData(document.getElementById('qcForm'));
      const b=Object.fromEntries(fd.entries());
      if(!b.nombre||!b.nif||!b.direccion){toast('Razón social, NIF y dirección son obligatorios',true);return;}
      const tipo=s.mi_papel==='transportista'?'Cargador':'Transportista';
      try{
        const saved=await api('/api/empresas',{method:'POST',body:{...b,tipo}});
        companies=await api('/api/empresas').catch(()=>companies);
        s.contraparte_id=String(saved.id||'');
        s.contraparte_nombre=b.nombre;
        s.contraparte_nif=b.nif;
        s.contraparte_direccion=[b.direccion,b.cp,b.ciudad].filter(Boolean).join(', ');
        toast('Empresa guardada y seleccionada');
        close();
        render();
      }catch(e){toast(e.message,true);}
    };
  }

  function render(){
    const emp=state.settings;
    const esDeca=s.tipo==='deca';
    const esTransportista=s.mi_papel==='transportista';

    // Bloque «Mi entidad» (fijo, bloqueado)
    const miEntidadHtml=`<div class="info-note" style="background:#f0f8f0;border-color:#b3d9b3">${I('lock')}<div><strong>${esc(emp.nombre||'— Sin nombre —')}</strong> &nbsp;·&nbsp; NIF: ${esc(emp.nif||'—')}<div style="margin-top:4px;font-size:11px;color:#555">${esc([emp.domicilio,emp.cp,emp.ciudad,emp.provincia].filter(Boolean).join(', ')||'Sin dirección configurada')}</div><div style="font-size:11px;color:#888;margin-top:2px">Edita en «Mi entidad» si necesitas cambiar estos datos.</div></div></div>`;

    // Bloque contraparte (buscar entre empresas o crear nueva)
    const cList=companies.filter(c=>esTransportista?c.tipo==='Cargador'||c.tipo==='Cliente':c.tipo==='Transportista');
    const cpLabel=esTransportista?(esDeca?'Cargador contractual':'Remitente contractual'):'Transportista efectivo';
    const cpOpts=cList.map(c=>({value:c.id,label:`${c.nombre} — ${c.nif}`}));
    // Buscar si hay empresa seleccionada
    const cpSelected=s.contraparte_id;
    const contraparteHtml=`<div style="display:flex;gap:8px;align-items:flex-end">
      <div style="flex:1">${selectHtml('contraparte_id',cpLabel+' *',cpOpts,cpSelected,false)}</div>
      <button type="button" class="btn-secondary btn-small" id="btnNuevaContraparte" style="flex:none;white-space:nowrap">${I('plus')} Nueva empresa</button>
    </div>
    <div id="cpManualBlock" style="${cpSelected?'display:none':''}">
      <div class="grid grid2 mt4">
        ${fieldHtml('contraparte_nombre',cpLabel+' (nombre)','text',s.contraparte_nombre,!cpSelected)}
        ${fieldHtml('contraparte_nif','NIF / CIF','text',s.contraparte_nif,!cpSelected)}
        ${fieldHtml('contraparte_direccion','Dirección completa','text',s.contraparte_direccion,!cpSelected)}
      </div>
      <div class="field-help" style="margin-top:8px">${I('alert',14)} Si no encuentras la empresa en la lista, rellena los campos manuales o usa «Nueva empresa» para crearla.</div>
    </div>`;

    // Medios de transporte
    const vOpts=vehicles.map(v=>({value:v.matricula,label:`${v.matricula} · ${v.tipo}`}));
    const rOpts=vehicles.filter(v=>/remolque|semirremolque/i.test(v.tipo)).map(v=>({value:v.matricula,label:`${v.matricula} · ${v.modelo||v.tipo}`}));
    const dOpts=drivers.filter(x=>x.activo).map(c=>({value:`${c.nombre} · ${c.dni}`,label:`${c.nombre} · ${c.dni}`}));
    const medioHtml=`<div class="grid grid4">
      ${selectHtml('matricula','Vehículo *',vOpts,s.matricula,true)}
      ${selectHtml('remolque','Remolque',rOpts,s.remolque,false)}
      ${selectHtml('conductor','Conductor',dOpts,s.conductor,false)}
      ${fieldHtml('autorizacion','Aut. especial','text',s.autorizacion||'')}
    </div>`;

    // Servicio
    const locOpts=locations.map(l=>({value:`${l.nombre} — ${l.direccion}, ${l.cp} ${l.ciudad}`,label:l.nombre}));
    const serviceHtml=`<div class="grid grid3">
      ${fieldHtml('destinatario','Destinatario *','text',s.destinatario||'',true)}
      ${fieldHtml('origen',esDeca?'Lugar de carga *':'Lugar de toma de la mercancía *','text',s.origen||'',true)}
      ${fieldHtml('destino',esDeca?'Lugar de descarga *':'Lugar de entrega *','text',s.destino||'',true)}
      ${fieldHtml('f_carga',esDeca?'Fecha del transporte *':'Fecha de toma *','date',s.f_carga||nowDate(),true)}
    </div><div class="grid grid3 mt4">
      ${fieldHtml('mercancia',esDeca?'Naturaleza de la mercancía *':'Designación de la mercancía *','text',s.mercancia||'',true)}
      ${fieldHtml('peso',esDeca?'Peso (kg) *':'Peso bruto (kg)','number',s.peso||'',esDeca)}
      ${esDeca?fieldHtml('nalbaran','Nº albarán','text',s.nalbaran||''):fieldHtml('bultos','Nº de bultos','number',s.bultos||'')}
    </div>`;

    // Observaciones
    const obsHtml=esDeca?`<div class="grid grid2">
      <label class="field"><span>Observaciones del cargador contractual</span><textarea name="obs" class="textarea">${esc(s.obs||'')}</textarea></label>
      <label class="field"><span>Observaciones del transportista efectivo</span><textarea name="obs_transportista" class="textarea">${esc(s.obs_transportista||'')}</textarea></label>
    </div>` : `<div class="grid grid2">${fieldHtml('instrucciones','Instrucciones del remitente','text',s.instrucciones||'')}${fieldHtml('reservas','Reservas del porteador','text',s.reservas||'')}</div>`;

    // Sección «tu entidad» y sección «contraparte» según el papel
    const secMiEntidadLabel=esTransportista?'Transportista efectivo (tu entidad)':'Cargador contractual (tu entidad)';
    const secContraparteLabel=esTransportista?(esDeca?'Cargador contractual':'Remitente contractual'):'Transportista efectivo';

    document.getElementById('view').innerHTML=`
      <div class="page-head"><div class="inline"><button class="btn-ghost btn-small" id="backShip">${I('back')} Volver</button><div><h1 class="page-title">Nuevo envío</h1><div class="page-sub">Crea un ${esDeca?'DeCA':'eCMR'} · Campos obligatorios marcados con *</div></div></div><div class="actions">${badge('borrador')}</div></div>
      <form id="shipmentForm" autocomplete="off"><div class="grid gap12">

      ${section('Tipo de documento',`<div class="grid grid2">${selectHtml('tipo','Tipo de documento',[{value:'deca',label:'DeCA · Documento de Control Administrativo'},{value:'ecmr',label:'eCMR · Carta de porte por carretera'}],s.tipo,true)}</div>`)}

      ${section('¿Cómo actúa tu entidad?',`
        <div style="display:flex;gap:24px;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600">
            <input type="radio" name="mi_papel" value="transportista" ${esTransportista?'checked':''} style="width:18px;height:18px">
            ${I('truck')} Como <strong>Transportista efectivo</strong>
          </label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600">
            <input type="radio" name="mi_papel" value="cargador" ${!esTransportista?'checked':''} style="width:18px;height:18px">
            ${I('building')} Como <strong>Cargador contractual</strong>
          </label>
        </div>
        <div class="field-help" style="margin-top:10px">
          <strong>Transportista efectivo:</strong> tu empresa realiza físicamente el transporte y aporta los vehículos.<br>
          <strong>Cargador contractual:</strong> tu empresa contrata el transporte (cliente, remitente o expedidor).
        </div>
      `)}

      ${section(secMiEntidadLabel,miEntidadHtml)}
      ${section(secContraparteLabel,contraparteHtml)}
      ${section('Medios de transporte',medioHtml)}
      ${section('Mercancía y trayecto',serviceHtml)}
      ${section('Observaciones',obsHtml)}

      </div><div class="form-footer">
        <button type="button" class="btn-secondary" id="cancelShipment">${I('x')} Cancelar</button>
        <span style="flex:1"></span>
        <button type="button" class="btn-secondary" id="saveDraft">${I('save')} Guardar borrador</button>
        <button class="btn-primary" type="submit">${I('save')} Emitir y generar PDF</button>
      </div></form>`;

    document.getElementById('backShip').onclick=()=>go('envios');
    document.getElementById('cancelShipment').onclick=()=>go('envios');
    document.getElementById('saveDraft').onclick=()=>submitShipment(false);
    document.getElementById('shipmentForm').onsubmit=e=>{e.preventDefault();submitShipment(true)};

    // Radio papel
    document.querySelectorAll('[name=mi_papel]').forEach(r=>r.onchange=e=>{s.mi_papel=e.target.value;s.contraparte_id='';s.contraparte_nombre='';s.contraparte_nif='';s.contraparte_direccion='';render();});
    // Tipo doc
    document.querySelector('[name=tipo]').onchange=e=>{s.tipo=e.target.value;render();};
    // Contraparte select
    document.querySelector('[name=contraparte_id]')?.addEventListener('change',e=>{
      s.contraparte_id=e.target.value;
      const selEmp=companies.find(c=>String(c.id)===e.target.value);
      if(selEmp){s.contraparte_nombre=selEmp.nombre;s.contraparte_nif=selEmp.nif;s.contraparte_direccion=[selEmp.direccion,selEmp.cp,selEmp.ciudad].filter(Boolean).join(', ');}
      const manualBlock=document.getElementById('cpManualBlock');
      if(manualBlock)manualBlock.style.display=e.target.value?'none':'';
      // update hidden fields
      ['contraparte_nombre','contraparte_nif','contraparte_direccion'].forEach(k=>{const el=document.querySelector(`[name=${k}]`);if(el)el.value=s[k]||'';});
    });
    document.getElementById('btnNuevaContraparte')?.addEventListener('click',abrirModalNuevaContraparte);
    // Sync all other inputs
    document.getElementById('shipmentForm').oninput=e=>{if(e.target.name&&e.target.name!=='mi_papel'&&e.target.name!=='tipo'&&e.target.name!=='contraparte_id')s[e.target.name]=e.target.value;};
  }

  const submitShipment=async emit=>{
    const fd=new FormData(document.getElementById('shipmentForm'));
    const data=Object.fromEntries(fd.entries());
    const tipo=data.tipo; delete data.tipo;
    try{
      if(!state.settings.nombre||!state.settings.nif)throw new Error('Configura primero los datos de Mi entidad (razón social y NIF).');
      // Validar contraparte
      if(!data.contraparte_id&&!data.contraparte_nombre)throw new Error('Selecciona o introduce la empresa contraparte.');
      if(!data.contraparte_id&&!data.contraparte_nif)throw new Error('Introduce el NIF de la empresa contraparte.');
      if(!data.contraparte_id&&!data.contraparte_direccion)throw new Error('Introduce la dirección de la empresa contraparte.');
      const r=await api('/api/docs',{method:'POST',body:{tipo,datos:data,estado:emit?'emitido':'borrador'}});
      toast(`${r.num} ${emit?'emitido':'guardado como borrador'}`);
      go('envios');
      setTimeout(()=>openDocModal({id:r.id,num:r.num,url:r.url,estado:r.estado,datos:data}),300);
    }catch(e){toast(e.message,true)}
  };

  render();
}

async function openDocModal(d){if(!d)return;const canEdit=perm(d.tipo+'_crear');let html=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><div class="modal-title">${esc(d.num)}</div><div class="small muted">${esc(d.datos.cliente||'')} · ${badge(d.estado)}</div></div><button class="close-btn" id="closeModal">${I('x')}</button></div><div class="modal-body"><div class="pdf-wrap"><iframe class="pdf-frame" src="${esc(d.url)}?t=${Date.now()}"></iframe><div class="qrbox"><img src="/api/qr?u=${encodeURIComponent(d.url)}" alt="QR del documento"><div class="small muted center">Enlace público del documento</div><button class="btn-secondary btn-small full" id="copyLink">${I('copy')} Copiar enlace</button><a class="btn-secondary btn-small full" href="${esc(d.url)}" target="_blank" rel="noreferrer">${I('external')} Abrir PDF</a></div></div></div><div class="modal-foot">${canEdit&&d.estado!=='anulado'&&d.estado!=='cerrado'?`<button class="btn-secondary" id="editDoc">${I('edit')} Modificar datos</button><button class="btn-danger" id="annulDoc">Anular</button><button class="btn-secondary" id="closeDoc">Cerrar</button>`:''}<button class="btn-secondary" id="closeModal2">Cerrar ventana</button></div></div></div>`;const mount=document.createElement('div');mount.innerHTML=html;document.body.appendChild(mount.firstElementChild);const modal=document.body.lastElementChild;const close=()=>modal.remove();document.getElementById('closeModal').onclick=close;document.getElementById('closeModal2').onclick=close;document.getElementById('copyLink').onclick=()=>navigator.clipboard?.writeText(d.url).then(()=>toast('Enlace copiado')).catch(()=>toast(d.url));document.getElementById('editDoc')?.addEventListener('click',()=>{close();openEditDoc(d)});document.getElementById('annulDoc')?.addEventListener('click',async()=>{await changeDocState(d,'anulado','Anulación del documento');});document.getElementById('closeDoc')?.addEventListener('click',async()=>{await changeDocState(d,'cerrado','Cierre del documento');});}
async function changeDocState(d,state,label){const reason=prompt(label+' — indica el motivo:');if(!reason?.trim())return;try{await api('/api/docs/'+d.id+'/estado',{method:'PATCH',body:{estado:state,motivo:reason}});toast(`Documento ${STATUS_LABEL[state].toLowerCase()}`);document.querySelector('.modal-backdrop')?.remove();pageShipments();}catch(e){toast(e.message,true);}}
function openEditDoc(d){const fields=state.fields?.CAMPOS?.[d.tipo]||[];const body=`<form id="editDocForm" class="grid grid2">${fields.filter(([k,,t])=>t!=='cliente').map(([k,l,t])=>fieldHtml(k,l,t,d.datos[k]||'',false)).join('')}<label class="field" style="grid-column:1/-1"><span>Motivo de la modificación <span class="req">*</span></span><textarea name="motivo" class="textarea" required></textarea></label></form>`;const wrap=document.createElement('div');wrap.innerHTML=`<div class="modal-backdrop"><div class="modal small"><div class="modal-head"><div><div class="modal-title">Modificar ${esc(d.num)}</div><div class="small muted">La URL y el QR del documento no cambian.</div></div><button class="close-btn" id="editClose">${I('x')}</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn-secondary" id="editCancel">Cancelar</button><button class="btn-primary" id="editSave">${I('save')} Guardar cambios</button></div></div></div>`;document.body.appendChild(wrap.firstElementChild);const modal=document.body.lastElementChild;const close=()=>modal.remove();document.getElementById('editClose').onclick=close;document.getElementById('editCancel').onclick=close;document.getElementById('editSave').onclick=async()=>{const fd=new FormData(document.getElementById('editDocForm'));const body=Object.fromEntries(fd.entries());const motivo=body.motivo;delete body.motivo;body.motivo=motivo;try{await api('/api/docs/'+d.id,{method:'PUT',body});toast('Cambios guardados y PDF regenerado');close();setTimeout(()=>pageShipments(),80);}catch(e){toast(e.message,true)}};}

function companyTone(t){return t==='Cliente'?'blue':t==='Transportista'?'green':'amber';}
function companyForm(c={}){return `<form id="companyForm" class="grid grid2">${fieldHtml('nombre','Razón social / Nombre','text',c.nombre||'',true)}${fieldHtml('nif','NIF/CIF','text',c.nif||'',true)}${selectHtml('tipo','Tipo',[{value:'Cliente',label:'Cliente'},{value:'Cargador',label:'Cargador contractual'},{value:'Transportista',label:'Transportista'}],c.tipo||'Cliente',true)}${fieldHtml('direccion','Dirección','text',c.direccion||'')}${fieldHtml('cp','Código postal','text',c.cp||'')}${fieldHtml('ciudad','Ciudad','text',c.ciudad||'')}${fieldHtml('email','Correo electrónico','text',c.email||'')}${fieldHtml('tel','Teléfono','text',c.tel||'')}<input type="hidden" name="id" value="${esc(c.id||'')}"><input type="hidden" name="cliente_id" value="${esc(c.cliente_id||'')}"></form>`}
async function pageCompanies(){companies=await api('/api/empresas');let tab='Todas',q='';const render=()=>{const list=companies.filter(c=>(tab==='Todas'||c.tipo===tab)&&(c.nombre+c.nif+c.ciudad).toLowerCase().includes(q.toLowerCase()));document.getElementById('view').innerHTML=`${head('Empresas','Clientes, cargadores y transportistas habituales',`<button class="btn-primary" id="addCompany">${I('plus')} Añadir empresa</button>`)}<div class="info-note">${I('pin')}<div>Las empresas de tipo <strong>Cliente</strong> se mantienen también en el catálogo contractual usado por DeCA y eCMR.</div></div><div class="searchbar mb4">${I('search')}<input id="companySearch" class="input" placeholder="Buscar por nombre, NIF/CIF o ciudad" value="${esc(q)}"></div><div class="tabs">${['Todas','Cliente','Cargador','Transportista'].map(x=>`<button class="tab ${tab===x?'active':''}" data-ctab="${x}">${x}<span class="pill-count">${x==='Todas'?companies.length:companies.filter(c=>c.tipo===x).length}</span></button>`).join('')}</div><div class="tile-grid">${list.map(c=>`<div class="tile-btn"><div class="tile-top"><div class="tile-icon">${I('building')}</div><div class="tile-main"><div class="tile-title">${esc(c.nombre)}</div><div class="tile-sub">${esc(c.nif)}</div></div>${`<span class="badge ${companyTone(c.tipo)}">${esc(c.tipo)}</span>`}</div><div class="tile-meta"><span>${I('pin',15)} ${esc([c.ciudad,c.cp].filter(Boolean).join(' · ')||'Sin ubicación')}</span>${c.tel?`<span>${I('phone',15)} ${esc(c.tel)}</span>`:''}</div><div class="actions mt4"><button class="btn-secondary btn-small" data-edit-company="${c.id}">${I('edit')} Editar</button><button class="btn-danger btn-small" data-del-company="${c.id}">${I('trash')} Eliminar</button></div></div>`).join('')||'<div class="card empty" style="grid-column:1/-1">No hay empresas que coincidan.</div>'}</div>`;document.getElementById('companySearch').oninput=e=>{q=e.target.value;render();};document.querySelectorAll('[data-ctab]').forEach(b=>b.onclick=()=>{tab=b.dataset.ctab;render();});document.getElementById('addCompany').onclick=()=>openCompanyModal();document.querySelectorAll('[data-edit-company]').forEach(b=>b.onclick=()=>openCompanyModal(companies.find(c=>String(c.id)===b.dataset.editCompany)));document.querySelectorAll('[data-del-company]').forEach(b=>b.onclick=async()=>{const c=companies.find(x=>String(x.id)===b.dataset.delCompany);if(!confirm(`¿Eliminar ${c.nombre}?`))return;try{await api('/api/empresas/'+c.id,{method:'DELETE'});toast('Empresa eliminada');await pageCompanies();}catch(e){toast(e.message,true)}})};render();}
async function openCompanyModal(c={}){showFormModal(c.id?'Editar empresa':'Añadir empresa',companyForm(c),async()=>{const fd=new FormData(document.getElementById('companyForm'));const body=Object.fromEntries(fd.entries());body.id=body.id||undefined;body.cliente_id=Number(body.cliente_id)||undefined;await api('/api/empresas',{method:'POST',body});toast('Empresa guardada');document.querySelector('.modal-backdrop')?.remove();await pageCompanies();});}

async function pageTransport(){vehicles=await api('/api/vehiculos');drivers=await api('/api/conductores');let tab='vehiculos';const render=()=>{document.getElementById('view').innerHTML=`${head('Medios de transporte','Recursos de tu entidad asignables a envíos',`<button class="btn-primary" id="addFleet">${I('plus')} ${tab==='vehiculos'?'Añadir vehículo':'Añadir conductor'}</button>`)}<div class="tabs"><button class="tab ${tab==='vehiculos'?'active':''}" data-t="vehiculos">Mis Vehículos <span class="pill-count">${vehicles.length}</span></button><button class="tab ${tab==='conductores'?'active':''}" data-t="conductores">Mis Conductores <span class="pill-count">${drivers.length}</span></button></div>${tab==='vehiculos'?`<div class="tile-grid">${vehicles.map(v=>`<div class="tile-btn"><div class="tile-top"><div class="tile-icon">${I(/remolque|semirremolque/i.test(v.tipo)?'box':'truck')}</div><div class="tile-main"><div class="tile-title mono">${esc(v.matricula)}</div><div class="tile-sub">${esc(v.tipo)} · ${esc(v.modelo||'')}</div></div>${badgeVehicle(v.estado)}</div><div class="tile-meta"><span>ITV: ${esc(fmtDate(v.itv)||'Sin fecha')}</span></div><div class="actions mt4"><button class="btn-secondary btn-small" data-edit-v="${v.id}">${I('edit')} Editar</button><button class="btn-danger btn-small" data-del-v="${v.id}">${I('trash')} Eliminar</button></div></div>`).join('')||'<div class="card empty" style="grid-column:1/-1">Aún no has dado de alta vehículos.</div>'}</div>`:`<div class="tile-grid">${drivers.map(d=>`<div class="tile-btn"><div class="tile-top"><div class="tile-icon">${I('user')}</div><div class="tile-main"><div class="tile-title">${esc(d.nombre)}</div><div class="tile-sub">${esc(d.dni)} · ${esc(d.telefono||'Sin teléfono')}</div></div>${`<span class="badge ${d.activo?'green':'gray'}">${d.activo?'Activo':'Inactivo'}</span>`}</div><div class="tile-meta">${d.email?`<span>${I('mail',15)} ${esc(d.email)}</span>`:''}</div><div class="actions mt4">${d.telefono?`<a class="btn-secondary btn-small" href="sms:${esc(d.telefono)}">${I('phone')} SMS</a>`:''}${d.email?`<a class="btn-secondary btn-small" href="mailto:${esc(d.email)}">${I('mail')} Correo</a>`:''}<button class="btn-secondary btn-small" data-edit-d="${d.id}">${I('edit')} Editar</button><button class="btn-danger btn-small" data-del-d="${d.id}">${I('trash')} Eliminar</button></div></div>`).join('')||'<div class="card empty" style="grid-column:1/-1">Aún no has dado de alta conductores.</div>'}</div>`}`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});document.getElementById('addFleet').onclick=()=>tab==='vehiculos'?openVehicleModal():openDriverModal();document.querySelectorAll('[data-edit-v]').forEach(b=>b.onclick=()=>openVehicleModal(vehicles.find(x=>String(x.id)===b.dataset.editV)));document.querySelectorAll('[data-del-v]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar el vehículo?'))return;await api('/api/vehiculos/'+b.dataset.delV,{method:'DELETE'});toast('Vehículo eliminado');vehicles=await api('/api/vehiculos');render();});document.querySelectorAll('[data-edit-d]').forEach(b=>b.onclick=()=>openDriverModal(drivers.find(x=>String(x.id)===b.dataset.editD)));document.querySelectorAll('[data-del-d]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar el conductor?'))return;await api('/api/conductores/'+b.dataset.delD,{method:'DELETE'});toast('Conductor eliminado');drivers=await api('/api/conductores');render();});};render();}
function badgeVehicle(s){const c=s==='Disponible'?'green':s==='En ruta'?'blue':s==='Taller'?'amber':'gray';return `<span class="badge ${c}">${esc(s||'Disponible')}</span>`}
async function openVehicleModal(v={}){const body=`<form id="vehicleForm" class="grid grid2">${fieldHtml('matricula','Matrícula','text',v.matricula||'',true)}${selectHtml('tipo','Tipo',[{value:'Tractora',label:'Tractora'},{value:'Rígido',label:'Rígido'},{value:'Remolque',label:'Remolque'},{value:'Semirremolque',label:'Semirremolque'}],v.tipo||'Tractora',true)}${fieldHtml('modelo','Modelo','text',v.modelo||'')}${selectHtml('estado','Estado',[{value:'Disponible',label:'Disponible'},{value:'En ruta',label:'En ruta'},{value:'Taller',label:'Taller'}],v.estado||'Disponible')}${fieldHtml('itv','Fecha ITV','date',v.itv||'')}</form>`;showFormModal(v.id?'Editar vehículo':'Añadir vehículo',body,async()=>{const fd=new FormData(document.getElementById('vehicleForm'));const body=Object.fromEntries(fd.entries());if(v.id)body.id=v.id;await api('/api/vehiculos',{method:'POST',body});toast('Vehículo guardado');document.querySelector('.modal-backdrop')?.remove();await pageTransport();});}
async function openDriverModal(d={}){const body=`<form id="driverForm" class="grid grid2">${fieldHtml('nombre','Nombre completo','text',d.nombre||'',true)}${fieldHtml('dni','DNI/NIE','text',d.dni||'',true)}${fieldHtml('telefono','Teléfono','text',d.telefono||'')}${fieldHtml('email','Correo electrónico','text',d.email||'')}${`<label class="field"><span>Estado</span><select class="select" name="activo"><option value="true" ${d.activo!==false?'selected':''}>Activo</option><option value="false" ${d.activo===false?'selected':''}>Inactivo</option></select></label>`}</form>`;showFormModal(d.id?'Editar conductor':'Añadir conductor',body,async()=>{const fd=new FormData(document.getElementById('driverForm'));const body=Object.fromEntries(fd.entries());body.activo=body.activo!=='false';if(d.id)body.id=d.id;await api('/api/conductores',{method:'POST',body});toast('Conductor guardado');document.querySelector('.modal-backdrop')?.remove();await pageTransport();});}

async function pageGoods(){goods=await api('/api/mercancias');document.getElementById('view').innerHTML=`${head('Mercancías','Tipos de mercancía habituales',`<button class="btn-primary" id="addGood">${I('plus')} Añadir mercancía</button>`)}<div class="info-note">${I('package')}<div>Este catálogo se ofrece como sugerencia al registrar un nuevo DeCA o eCMR.</div></div><div class="card data-list"><div class="data-head" style="grid-template-columns:1fr 180px 120px 160px"><span>Mercancía</span><span>Código</span><span>Unidad</span><span></span></div>${goods.map(g=>`<div class="data-item" style="grid-template-columns:1fr 180px 120px 160px"><div><div class="row-title">${esc(g.nombre)}</div></div><div class="mono small">${esc(g.codigo||'—')}</div><div class="small">${esc(g.unidad)}</div><div class="actions"><button class="btn-secondary btn-small" data-edit-g="${g.id}">${I('edit')}</button><button class="btn-danger btn-small" data-del-g="${g.id}">${I('trash')}</button></div></div>`).join('')||`<div class="empty">Aún no hay mercancías configuradas.</div>`}</div>`;document.getElementById('addGood').onclick=()=>openGoodModal();document.querySelectorAll('[data-edit-g]').forEach(b=>b.onclick=()=>openGoodModal(goods.find(x=>String(x.id)===b.dataset.editG)));document.querySelectorAll('[data-del-g]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar la mercancía?'))return;await api('/api/mercancias/'+b.dataset.delG,{method:'DELETE'});toast('Mercancía eliminada');await pageGoods();});}
async function openGoodModal(g={}){const body=`<form id="goodForm" class="grid grid2">${fieldHtml('nombre','Nombre / descripción','text',g.nombre||'',true)}${fieldHtml('codigo','Código LER / NC','text',g.codigo||'')}${selectHtml('unidad','Unidad',[...['kg','t','l','m³','palés','uds'].map(x=>({value:x,label:x}))],g.unidad||'kg',true)}</form>`;showFormModal(g.id?'Editar mercancía':'Añadir mercancía',body,async()=>{const body=Object.fromEntries(new FormData(document.getElementById('goodForm')).entries());if(g.id)body.id=g.id;await api('/api/mercancias',{method:'POST',body});toast('Mercancía guardada');document.querySelector('.modal-backdrop')?.remove();await pageGoods();});}

async function pageLocations(){locations=await api('/api/ubicaciones');document.getElementById('view').innerHTML=`${head('Ubicaciones frecuentes','Almacenes, naves y puntos de carga/descarga',`<button class="btn-primary" id="addLoc">${I('plus')} Añadir ubicación</button>`)}<div class="info-note">${I('pin')}<div>Estas direcciones se ofrecen para autocompletar el origen y destino durante el registro de envíos.</div></div><div class="tile-grid">${locations.map(l=>`<div class="tile-btn"><div class="tile-top"><div class="tile-icon">${I('pin')}</div><div class="tile-main"><div class="tile-title">${esc(l.nombre)}</div><div class="tile-sub">${esc(l.direccion||'')}</div></div><span class="badge ${l.tipo==='Almacén propio'?'blue':l.tipo==='Cliente'?'amber':'gray'}">${esc(l.tipo)}</span></div><div class="tile-meta"><span>${esc([l.cp,l.ciudad,l.provincia].filter(Boolean).join(' · ')||'Sin código postal')}</span>${l.empresa?`<span>${esc(l.empresa)}</span>`:''}</div><div class="actions mt4"><button class="btn-secondary btn-small" data-edit-l="${l.id}">${I('edit')} Editar</button><button class="btn-danger btn-small" data-del-l="${l.id}">${I('trash')} Eliminar</button></div></div>`).join('')||'<div class="card empty" style="grid-column:1/-1">Aún no hay ubicaciones configuradas.</div>'}</div>`;document.getElementById('addLoc').onclick=()=>openLocModal();document.querySelectorAll('[data-edit-l]').forEach(b=>b.onclick=()=>openLocModal(locations.find(x=>String(x.id)===b.dataset.editL)));document.querySelectorAll('[data-del-l]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar la ubicación?'))return;await api('/api/ubicaciones/'+b.dataset.delL,{method:'DELETE'});toast('Ubicación eliminada');await pageLocations();});}
async function openLocModal(l={}){const body=`<form id="locForm" class="grid grid2">${fieldHtml('nombre','Nombre','text',l.nombre||'',true)}${selectHtml('tipo','Tipo',[{value:'Almacén propio',label:'Almacén propio'},{value:'Punto de carga',label:'Punto de carga'},{value:'Punto de descarga',label:'Punto de descarga'},{value:'Cliente',label:'Cliente'}],l.tipo||'Punto de carga')}${fieldHtml('direccion','Dirección','text',l.direccion||'',true)}${fieldHtml('cp','Código postal','text',l.cp||'')}${fieldHtml('ciudad','Localidad','text',l.ciudad||'',true)}${fieldHtml('provincia','Provincia','text',l.provincia||'')}${fieldHtml('empresa','Empresa / referencia','text',l.empresa||'')}</form>`;showFormModal(l.id?'Editar ubicación':'Añadir ubicación',body,async()=>{const body=Object.fromEntries(new FormData(document.getElementById('locForm')).entries());if(l.id)body.id=l.id;await api('/api/ubicaciones',{method:'POST',body});toast('Ubicación guardada');document.querySelector('.modal-backdrop')?.remove();await pageLocations();});}

async function pageUsers(){
  let activeTab='usuarios',users=[],auditLogs=[];
  try{users=await api('/api/usuarios');}catch{}
  const perms=Object.entries((state.user||{}).PERMISOS||{});
  const render=()=>{
    document.getElementById('view').innerHTML=`${head('Usuarios y Seguridad','Control de accesos, roles y registro de eventos del sistema',activeTab==='usuarios'?`<button class="btn-primary" id="addUser">${I('plus')} Dar de alta usuario</button>`:`<button class="btn-secondary" id="refreshAudit">${I('history')} Actualizar registros</button>`)}<div class="tabs"><button class="tab ${activeTab==='usuarios'?'active':''}" data-utab="usuarios">${I('users',16)} Usuarios del sistema <span class="pill-count">${users.length}</span></button><button class="tab ${activeTab==='auditoria'?'active':''}" data-utab="auditoria">${I('shield',16)} Auditoría de seguridad <span class="pill-count">${auditLogs.length||'Logs'}</span></button></div>${activeTab==='usuarios'?`<div class="card data-list"><div class="data-head" style="grid-template-columns:1.2fr 1fr 150px 110px 60px"><span>Nombre / Usuario</span><span>Contacto</span><span>Último acceso</span><span>Estado</span><span></span></div>${users.map(u=>`<div class="data-item" style="grid-template-columns:1.2fr 1fr 150px 110px 60px"><div class="row-main"><div class="row-title">${esc(u.nombre)}</div><div class="row-sub mono">@${esc(u.usuario)}</div></div><div class="small">${esc(u.email||'—')}</div><div class="small mono muted">${u.ultimo_login?`${fmtDate(u.ultimo_login)} <span style="font-size:10px">(${esc(u.ultimo_login_ip||'local')})</span>`:'Nunca'}</div><div>${u.rol==='admin'?'<span class="badge blue">Admin</span>':'<span class="badge gray">Usuario</span>'}${u.activo?'<span class="badge green" style="margin-left:4px">Activo</span>':'<span class="badge red" style="margin-left:4px">Inactivo</span>'}</div><div class="actions"><button class="btn-secondary btn-small" data-edit-u="${u.id}">${I('edit')}</button></div></div>`).join('')||'<div class="empty">No hay usuarios dados de alta.</div>'}</div>`:`<div class="card data-list audit-list"><div class="audit-head"><span>Fecha y Hora</span><span>Usuario</span><span>IP Origen</span><span>Acción</span><span>Detalle</span><span>Nivel</span></div>${auditLogs.map(a=>`<div class="audit-item"><div class="mono small">${esc((a.fecha||'').slice(0,19).replace('T',' '))}</div><div><strong>${esc(a.usuario||'anónimo')}</strong></div><div class="mono small muted">${esc(a.ip||'—')}</div><div><span class="mono">${esc(a.accion)}</span></div><div class="small" style="color:var(--muted)">${esc(a.detalle||'—')}</div><div><span class="badge ${esc(a.severidad||'info')}">${esc(a.severidad||'info')}</span></div></div>`).join('')||'<div class="empty">No hay registros de auditoría aún.</div>'}</div>`}`;
    document.querySelectorAll('[data-utab]').forEach(b=>b.onclick=async()=>{
      activeTab=b.dataset.utab;
      if(activeTab==='auditoria'&&!auditLogs.length){try{auditLogs=await api('/api/audit-logs');}catch{}}
      render();
    });
    document.getElementById('addUser')?.addEventListener('click',()=>openUserModal(perms));
    document.getElementById('refreshAudit')?.addEventListener('click',async()=>{try{auditLogs=await api('/api/audit-logs');}catch{}render();});
    document.querySelectorAll('[data-edit-u]').forEach(b=>b.onclick=()=>openUserModal(perms,users.find(u=>String(u.id)===b.dataset.editU)));
  };
  render();
}
async function openUserModal(perms,u={permisos:[],activo:true,rol:'usuario',email:''}){
  const body=`<form id="userForm" class="grid grid2">${fieldHtml('usuario','Usuario','text',u.usuario||'',true)}${fieldHtml('nombre','Nombre completo','text',u.nombre||'',true)}${fieldHtml('email','Correo electrónico','email',u.email||'')}${selectHtml('rol','Rol',[{value:'usuario',label:'Usuario'},{value:'admin',label:'Administrador'}],u.rol||'usuario',true)}<div style="grid-column:1/-1">${fieldHtml('clave',u.id?'Nueva contraseña (dejar vacío para mantener la actual)':'Contraseña segura','password','')}<div class="field-help">Debe tener al menos 10 caracteres, combinando mayúsculas, minúsculas, números y símbolos (!@#$...).</div></div><label class="field" style="grid-column:1/-1"><span>Estado de la cuenta</span><select class="select" name="activo"><option value="true" ${u.activo!==false?'selected':''}>Activo (permitir acceso)</option><option value="false" ${u.activo===false?'selected':''}>Inactivo (bloquear acceso)</option></select></label><div style="grid-column:1/-1"><span style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Permisos asignados</span><div class="grid grid2">${perms.map(([k,l])=>`<label class="inline"><input type="checkbox" name="perm_${esc(k)}" ${u.permisos?.includes(k)?'checked':''}> ${esc(l)}</label>`).join('')}</div></div></form>`;
  showFormModal(u.id?'Editar usuario':'Dar de alta usuario',body,async()=>{
    const form=document.getElementById('userForm'),fd=new FormData(form);
    const body={id:u.id,usuario:fd.get('usuario'),nombre:fd.get('nombre'),email:fd.get('email'),clave:fd.get('clave'),rol:fd.get('rol'),activo:fd.get('activo')!=='false',permisos:perms.filter(([k])=>form.querySelector('[name="perm_'+k+'"]')?.checked).map(([k])=>k)};
    await api('/api/usuarios',{method:'POST',body});
    toast('Usuario guardado correctamente');
    document.querySelector('.modal-backdrop')?.remove();
    await pageUsers();
  });
}

async function pageEntity(){const s=await api('/api/ajustes');state.settings=s||{};const labels=Object.fromEntries((state.fields?.EMPRESA||[]).map(([k,l])=>[k,l]));const body=`<form id="entityForm"><div class="grid grid2">${(state.fields?.EMPRESA||[]).map(([k,l])=>fieldHtml(k,l,k.includes('nif')?'text':'text',s[k]||'')).join('')}</div><div class="form-footer" style="position:static;margin-top:16px"><button class="btn-primary" type="submit">${I('save')} Guardar cambios</button></div></form>`;document.getElementById('view').innerHTML=`${head('Mi entidad','Datos de la empresa que se copian en los nuevos documentos')}${`<div class="info-note">${I('settings')}<div>Los cambios afectan a <strong>documentos nuevos</strong>. Los documentos ya emitidos conservan la copia de datos que tenían al crearse.</div></div>`}${body}`;document.getElementById('entityForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target).entries());try{await api('/api/ajustes',{method:'PUT',body:b});state.settings=await api('/api/ajustes');toast('Datos de Mi entidad guardados');}catch(x){toast(x.message,true)}};}

function showFormModal(title,body,onSave){const mount=document.createElement('div');mount.innerHTML=`<div class="modal-backdrop"><div class="modal small"><div class="modal-head"><div class="modal-title">${esc(title)}</div><button class="close-btn" id="modalClose">${I('x')}</button></div><div class="modal-body">${body}<div id="formError" class="error"></div></div><div class="modal-foot"><button class="btn-secondary" id="modalCancel">Cancelar</button><button class="btn-primary" id="modalSave">${I('save')} Guardar</button></div></div></div>`;document.body.appendChild(mount.firstElementChild);const modal=document.body.lastElementChild;const close=()=>modal.remove();document.getElementById('modalClose').onclick=close;document.getElementById('modalCancel').onclick=close;document.getElementById('modalSave').onclick=async()=>{try{await onSave();}catch(e){document.getElementById('formError').textContent=e.message}}}

(async()=>{try{await bootstrap();}catch(e){console.error(e);showLogin();}})();
</script>
</body>
